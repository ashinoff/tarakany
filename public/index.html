<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Развитие</title>
  <meta name="description" content="Развитие: тараканьи бега, тестирование и задачи — за успехи падают монетки.">
  <meta name="theme-color" content="#23272e">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Развитие — на главную">
      <img class="brand__logo" src="/logo.svg" alt="" aria-hidden="true">
      <span class="brand__name">Развитие</span>
    </a>
    <span class="topbar__spacer"></span>
    <span class="coins" id="coins" title="Монетки падают за пройденные тесты и задачи — на них можно играть. Скоро!">
      <span class="coins__icon" aria-hidden="true"></span><b id="coinsValue">0</b><span class="coins__label">монеток</span>
    </span>
    <span class="me" id="me"><span class="me__avatar" id="meAvatar"></span><span class="me__name" id="meName">…</span></span>
  </header>

  <div class="layout" id="layout">
    <nav class="strips" id="strips" aria-label="Разделы"></nav>
    <aside class="menu" id="menu" hidden></aside>
    <div class="main">
      <main class="content" id="content"></main>
      <div class="frames" id="frames"></div>
    </div>
  </div>

  <script src="shell.js"></script>
</body>
</html>
