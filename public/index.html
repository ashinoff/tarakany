<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Развитие</title>
  <meta name="description" content="Развитие: тараканьи бега, тестирование и задачи — за успехи падают монетки.">
  <meta name="theme-color" content="#121317">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Развитие — на главную">
      <!-- живой логотип: росток покачивается, монетка подпрыгивает, искры мерцают -->
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="logoGlow" cx="50%" cy="62%" r="60%">
            <stop offset="0" stop-color="#3a2d55"/><stop offset=".55" stop-color="#1b1c24"/><stop offset="1" stop-color="#0d0e12"/>
          </radialGradient>
          <radialGradient id="coinFill" cx="35%" cy="35%" r="70%">
            <stop offset="0" stop-color="#fff1b8"/><stop offset=".6" stop-color="#f2b632"/><stop offset="1" stop-color="#a8700f"/>
          </radialGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#logoGlow)"/>
        <g class="logo__plant">
          <path d="M32 54V31" stroke="#f6efe6" stroke-width="3" stroke-linecap="round"/>
          <path class="logo__leaf logo__leaf--1" d="M32 34c-11 0-17-7-17-17 11 0 17 7 17 17z" fill="#3fd08a"/>
          <path class="logo__leaf logo__leaf--2" d="M32 31c0-11 7-17 17-17 0 11-7 17-17 17z" fill="#8293ff"/>
          <path class="logo__leaf logo__leaf--3" d="M32 44c-8 0-13 4-14 10 8 1 13-3 14-10z" fill="#ffaa5c"/>
        </g>
        <g class="logo__coin"><circle cx="50" cy="46" r="7" fill="url(#coinFill)"/><path d="M50 42.5v7" stroke="#8a5a0b" stroke-width="1.6" stroke-linecap="round"/></g>
        <path class="logo__spark logo__spark--1" d="M14 46l1.3 2.7L18 50l-2.7 1.3L14 54l-1.3-2.7L10 50l2.7-1.3z" fill="#fff4c9"/>
        <path class="logo__spark logo__spark--2" d="M47 9l1 2 2 1-2 1-1 2-1-2-2-1 2-1z" fill="#dccbf5"/>
      </svg>
      <span class="brand__name">Развитие</span>
    </a>
    <span class="topbar__divider" aria-hidden="true"></span>
    <button type="button" class="focus-toggle" id="focusBtn" hidden><span class="focus-toggle__icon" aria-hidden="true"></span><span class="focus-toggle__text">Развернуть</span></button>
    <span class="hello" id="hello"></span>
    <span class="topbar__spacer"></span>
    <span class="coins" id="coins" title="Монетки падают за пройденные тесты и задачи — на них можно играть.">
      <span class="coins__icon" aria-hidden="true"></span><b id="coinsValue">0</b><span class="coins__label">монеток</span>
    </span>
    <button type="button" class="me" id="me" aria-haspopup="menu" aria-expanded="false"><span class="me__avatar" id="meAvatar"></span><span class="me__name" id="meName">…</span><span class="me__caret" aria-hidden="true">▾</span></button>
    <div class="usermenu" id="userMenu" role="menu" hidden>
      <div class="usermenu__who" id="menuWho"></div>
      <a class="usermenu__item" href="#/races/mine" role="menuitem">Мои результаты</a>
      <a class="usermenu__item usermenu__item--admin" id="menuAdmin" href="#/admin/users" role="menuitem" hidden>Админка</a>
    </div>
  </header>

  <div class="stage" id="stage">
    <main class="content" id="content">
      <div class="content__page" id="page"></div>
      <div class="frames" id="frames"></div>
    </main>
  </div>

  <script src="shell.js"></script>
</body>
</html>
